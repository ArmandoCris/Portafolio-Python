<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Blog Headless</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4 text-center">Tech Blog (Headless CMS)</h1>
        <div id="contenedor-articulos" class="row">
            <!-- Los artículos se inyectarán aquí mediante JavaScript -->
            <div class="text-center w-100" id="cargando">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Conectando con la API...</p>
            </div>
        </div>
    </div>

    <script>
        // Consumir la API Headless localmente
        fetch('/api/articulos')
            .then(response => response.json())
            .then(data => {
                const contenedor = document.getElementById('contenedor-articulos');
                document.getElementById('cargando').style.display = 'none'; // Ocultar spinner
                
                data.forEach(articulo => {
                    const card = `
                        <div class="col-md-4 mb-4">
                            <div class="card h-100 shadow-sm border-0">
                                <div class="card-body">
                                    <h5 class="card-title text-primary">${articulo.titulo}</h5>
                                    <h6 class="card-subtitle mb-2 text-muted">${articulo.fecha_publicacion}</h6>
                                    <p class="card-text">${articulo.contenido}</p>
                                </div>
                            </div>
                        </div>
                    `;
                    contenedor.innerHTML += card;
                });
            })
            .catch(error => {
                console.error('Error al cargar la API:', error);
                document.getElementById('cargando').innerHTML = '<p class="text-danger">Error al cargar los datos.</p>';
            });
    </script>
</body>
</html>
