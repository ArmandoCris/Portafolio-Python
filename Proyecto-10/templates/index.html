<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Chat en Tiempo Real</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importación de la librería cliente de WebSockets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
</head>
<body class="bg-dark text-white">
    <div class="container mt-5" style="max-width: 600px;">
        <h2 class="mb-4 text-center">Sala de Chat (WebSockets)</h2>
        
        <div id="chat-box" class="bg-secondary p-3 mb-3 rounded shadow-sm" style="height: 400px; overflow-y: auto;">
            <!-- Los mensajes aparecerán aquí -->
        </div>
        
        <div class="input-group">
            <input type="text" id="username" class="form-control" placeholder="Tu nombre" style="max-width: 150px;">
            <input type="text" id="message" class="form-control" placeholder="Escribe un mensaje...">
            <button id="send-btn" class="btn btn-primary">Enviar</button>
        </div>
    </div>

    <script>
        // Iniciar conexión WebSocket
        const socket = io();

        // 1. Escuchar los mensajes que retransmite el servidor
        socket.on('message', function(msg) {
            const chatBox = document.getElementById('chat-box');
            const messageElement = document.createElement('div');
            
            messageElement.classList.add('bg-light', 'text-dark', 'p-2', 'mb-2', 'rounded');
            messageElement.innerHTML = `<strong>${msg.username}:</strong> ${msg.text}`;
            
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight; // Auto-scroll al fondo
        });

        // 2. Enviar mensaje al servidor
        document.getElementById('send-btn').addEventListener('click', function() {
            const username = document.getElementById('username').value || 'Anónimo';
            const message = document.getElementById('message').value;
            
            if (message.trim() !== '') {
                socket.send({'username': username, 'text': message});
                document.getElementById('message').value = ''; // Limpiar campo
            }
        });

        // Permitir enviar con la tecla Enter
        document.getElementById('message').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                document.getElementById('send-btn').click();
            }
        });
    </script>
</body>
</html>
