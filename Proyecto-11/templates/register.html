<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro - Clon Spotify</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex align-items-center vh-100">
    <div class="container" style="max-width: 400px;">
        <h2 class="text-center text-success mb-4">🎵 Crear Cuenta</h2>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form method="POST" class="bg-secondary p-4 rounded shadow">
            <div class="mb-3">
                <input type="text" name="username" class="form-control text-dark" placeholder="Nuevo Usuario" required>
            </div>
            <div class="mb-3">
                <input type="password" name="password" class="form-control text-dark" placeholder="Contraseña" required>
            </div>
            <button type="submit" class="btn btn-success w-100 rounded-pill font-weight-bold">Registrarse</button>
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-light">Volver al login</a>
            </div>
        </form>
    </div>
</body>
</html>
