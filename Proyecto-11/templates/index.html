<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reproductor Web</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212; color: white; padding-bottom: 90px; }
        .sidebar { height: 100vh; width: 250px; position: fixed; top: 0; left: 0; background-color: #000; padding-top: 20px; }
        .main-content { margin-left: 250px; padding: 20px; }
        .player-bar { position: fixed; bottom: 0; width: 100%; height: 90px; background-color: #181818; border-top: 1px solid #282828; display: flex; align-items: center; padding: 0 20px; z-index: 1000; }
        .card { background-color: #181818; border: none; border-radius: 8px; transition: background-color 0.3s; }
        .card:hover { background-color: #282828; }
        .play-btn { background-color: #1db954; color: white; border-radius: 50%; width: 40px; height: 40px; display: flex; justify-content: center; align-items: center; border: none; }
        .play-btn:hover { background-color: #1ed760; transform: scale(1.05); }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar d-flex flex-column align-items-center">
        <h3 class="text-success fw-bold mb-4">🎵 MySpotify</h3>
        <p class="text-light">Hola, {{ username }}</p>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm mt-auto mb-4 w-75 rounded-pill">Cerrar Sesión</a>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="input-group mb-4" style="max-width: 500px;">
            <input type="text" id="searchInput" class="form-control text-dark" placeholder="Buscar artistas, canciones...">
            <button class="btn btn-light" id="searchBtn">Buscar</button>
        </div>
        <h4 class="mb-4 fw-bold">Resultados</h4>
        <div id="resultsGrid" class="row g-4">
            <!-- Las tarjetas se generan vía JavaScript -->
        </div>
    </div>

    <!-- Player Bar -->
    <div class="player-bar d-flex justify-content-between">
        <div class="d-flex align-items-center w-25">
            <img id="playerCover" src="https://via.placeholder.com/60" alt="Portada" style="width: 60px; height: 60px; border-radius: 4px;" class="me-3 shadow">
            <div>
                <h6 id="playerTitle" class="mb-0 fw-bold">Sin reproducir</h6>
                <small id="playerArtist" class="text-secondary">Selecciona una pista</small>
            </div>
        </div>
        <div class="w-50 d-flex justify-content-center">
            <audio id="audioPlayer" controls class="w-75 rounded" style="height: 40px;">
                Tu navegador no soporta el elemento de audio.
            </audio>
        </div>
        <div class="w-25"></div>
    </div>

    <script>
        function searchMusic(query) {
            const url = `https://itunes.apple.com/search?term=${encodeURIComponent(query)}&entity=song&limit=12`;
            
            fetch(url)
                .then(response => response.json())
                .then(data => {
                    const grid = document.getElementById('resultsGrid');
                    grid.innerHTML = '';
                    
                    data.results.forEach(track => {
                        const card = document.createElement('div');
                        card.className = 'col-md-3 col-sm-6 col-12';
                        // Reemplazar 100x100 por una imagen más grande
                        const highResImage = track.artworkUrl100.replace('100x100', '300x300');
                        
                        card.innerHTML = `
                            <div class="card p-3 h-100 shadow-sm">
                                <img src="${highResImage}" class="card-img-top mb-3 shadow rounded" alt="Portada">
                                <h6 class="text-truncate fw-bold mb-1 text-white">${track.trackName}</h6>
                                <p class="text-secondary small text-truncate mb-3">${track.artistName}</p>
                                <button class="play-btn ms-auto mt-auto shadow" 
                                        data-preview="${track.previewUrl}" 
                                        data-title="${track.trackName}" 
                                        data-artist="${track.artistName}" 
                                        data-cover="${track.artworkUrl100}">
                                    ▶
                                </button>
                            </div>
                        `;
                        grid.appendChild(card);
                    });

                    // Añadir eventos a los botones de Play
                    document.querySelectorAll('.play-btn').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const audio = document.getElementById('audioPlayer');
                            audio.src = this.getAttribute('data-preview');
                            document.getElementById('playerTitle').innerText = this.getAttribute('data-title');
                            document.getElementById('playerArtist').innerText = this.getAttribute('data-artist');
                            document.getElementById('playerCover').src = this.getAttribute('data-cover');
                            audio.play();
                        });
                    });
                })
                .catch(error => console.error('Error fetching data:', error));
        }

        // Eventos de búsqueda
        document.getElementById('searchBtn').addEventListener('click', () => {
            const query = document.getElementById('searchInput').value;
            if (query) searchMusic(query);
        });

        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                document.getElementById('searchBtn').click();
            }
        });

        // Búsqueda inicial automática al cargar la página
        document.addEventListener('DOMContentLoaded', () => {
            searchMusic('Deep Pax Lab');
        });
    </script>
</body>
</html>
