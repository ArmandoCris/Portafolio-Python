<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Netflix - ¿Quién está viendo?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #141414; color: white; display: flex; align-items: center; justify-content: center; height: 100vh; flex-direction: column; }
        .avatar:hover { border: 3px solid white; cursor: pointer; }
    </style>
</head>
<body>
    <h1 class="mb-5 fw-bold">¿Quién está viendo ahora?</h1>
    <div class="d-flex gap-4">
        {% for p in perfiles %}
        <a href="{{ url_for('browse', perfil_id=p[0]) }}" class="text-decoration-none text-secondary text-center">
            <img src="{{ p[2] }}" width="150" class="rounded mb-3 avatar border border-3 border-transparent">
            <h4 class="text-white">{{ p[1] }}</h4>
        </a>
        {% endfor %}
    </div>
</body>
</html>
